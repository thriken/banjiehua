<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 - {{siteName}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap');

:root {
  --bg: #F5F0E8; --card-bg: #FFFBF5; --text: #3C3428;
  --text-2: #6B5E4F; --text-3: #999080; --accent: #B33A2A;
  --accent2: #D4A853; --border: #D4C5B9;
  --shadow: 0 2px 12px rgba(60, 52, 40, 0.08); --radius: 8px;
  --font-serif: 'Noto Serif SC', 'SimSun', serif;
  --font-display: 'Ma Shan Zheng', 'Noto Serif SC', cursive;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-serif); background: var(--bg); color: var(--text); line-height: 1.8; min-height: 100vh; }
.top-bar { background: linear-gradient(135deg, #2C2416 0%, #3C3428 100%); color: #F5F0E8; padding: 12px 0; border-bottom: 3px solid var(--accent2); }
.top-bar-inner { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
.site-title { font-family: var(--font-display); font-size: 28px; color: var(--accent2); text-decoration: none; letter-spacing: 4px; }
.site-title:hover { color: #E8C97A; }
.top-nav { display: flex; gap: 24px; align-items: center; }
.top-nav a { color: #C4B99A; text-decoration: none; font-size: 14px; transition: color 0.3s; }
.top-nav a:hover { color: var(--accent2); }
.container { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.admin-header h2 { font-family: var(--font-display); color: var(--accent); font-size: 24px; letter-spacing: 2px; }
.btn { display: inline-block; padding: 8px 18px; border: none; border-radius: var(--radius); font-family: var(--font-serif); font-size: 14px; cursor: pointer; text-decoration: none; transition: all 0.3s; }
.btn-primary { background: var(--accent); color: #FFFBF5; }
.btn-primary:hover { background: #9A2E20; }
.btn-secondary { background: var(--bg); color: var(--text-2); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: #C0392B; color: #FFF; }
.btn-danger:hover { background: #A93226; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.admin-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.admin-table th, .admin-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
.admin-table th { background: linear-gradient(135deg, #2C2416 0%, #3C3428 100%); color: var(--accent2); font-weight: 500; }
.admin-table tr:hover td { background: rgba(212, 168, 83, 0.05); }
.admin-table .actions { display: flex; gap: 6px; }
.toast { padding: 12px 16px; border-radius: var(--radius); font-size: 14px; margin-bottom: 16px; }
.toast.success { background: #D5F5E3; color: #1E8449; border: 1px solid #82E0AA; }
.toast.error { background: #FADBD8; color: #C0392B; border: 1px solid #F1948A; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state h3 { font-family: var(--font-display); font-size: 22px; color: var(--text-2); margin-bottom: 8px; }
.footer { text-align: center; padding: 32px 20px; color: var(--text-3); font-size: 13px; border-top: 1px solid var(--border); margin-top: 40px; }
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-bar-inner">
    <a href="/" class="site-title">半截话别乱用</a>
    <nav class="top-nav">
      <a href="/">前台</a><a href="/admin/" style="color:var(--accent2);">管理</a><a href="/export">导出数据</a>
    </nav>
  </div>
</div>

<div class="container">
  <div class="admin-header">
    <h2>📋 内容管理</h2>
    <a href="/admin/new" class="btn btn-primary">+ 新增条目</a>
  </div>

  {{#message}}<div class="toast {{msgType}}">{{message}}</div>{{/message}}

  {{#entries}}
  <table class="admin-table">
    <thead><tr><th>短语</th><th>全句</th><th>分类</th><th>来源</th><th>操作</th></tr></thead>
    <tbody>
      {{#entries}}
      <tr>
        <td><strong>{{phrase}}</strong></td>
        <td>{{fullTextShort}}</td>
        <td>{{category}}</td>
        <td>{{source}}</td>
        <td class="actions">
          <a href="/admin/edit/{{id}}" class="btn btn-secondary btn-sm">编辑</a>
          <a href="/admin/delete/{{id}}" class="btn btn-danger btn-sm" onclick="return confirm('确定删除「{{phrase}}」吗？')">删除</a>
        </td>
      </tr>
      {{/entries}}
    </tbody>
  </table>
  {{/entries}}

  {{^entries}}
  <div class="empty-state">
    <div class="empty-icon">📭</div>
    <h3>还没有任何内容</h3>
    <p>点击右上角「新增条目」开始收录吧</p>
  </div>
  {{/entries}}
</div>

<footer class="footer"><p>{{siteName}} · 后台管理</p></footer>
</body>
</html>
